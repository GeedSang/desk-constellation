<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desk Constellation · 桌面星图</title><style>:root{--a:#90b7ff;--m:#aebbd2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 15%,#293b6b,#101522 58%);color:#edf3ff;font:16px/1.6 system-ui,"Microsoft YaHei"}main{width:min(1180px,92vw);margin:auto;padding:48px 0 72px}.top{display:flex;justify-content:space-between}.eyebrow{color:var(--a);letter-spacing:.2em;font-size:12px;font-weight:800}.pill{border:1px solid #9dbdff35;border-radius:99px;padding:7px 13px;color:var(--m);font-size:12px}h1{font:800 clamp(44px,8vw,94px)/.9 Georgia;margin:42px 0 18px}.lead{color:var(--m);font-size:19px;max-width:700px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:48px}.card{border:1px solid #9dbdff2b;border-radius:28px;background:#111b31d9;box-shadow:0 22px 70px #0005;padding:24px}.sky{min-height:430px;position:relative;overflow:hidden;background:radial-gradient(circle at 52% 44%,#304679,#131d32 58%,#0b101c)}.sky:after{content:"";position:absolute;inset:12%;border:1px solid #9dbdff28;border-radius:50%}.star{position:absolute;width:9px;height:9px;border-radius:50%;background:#e5efff;box-shadow:0 0 22px #90b7ff;left:50%;top:43%;z-index:1}.s2{left:24%;top:28%}.s3{left:78%;top:66%}.sky h2{position:absolute;bottom:18px;left:24px;margin:0;color:#d5e3ff;font-size:25px;z-index:2}.control{display:flex;flex-direction:column;gap:16px}.preview{width:100%;aspect-ratio:16/10;background:#080d17;border-radius:18px;object-fit:cover}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--a);color:#101522;font-weight:800;cursor:pointer}.btn.alt{background:#25365e;color:#cadbff;margin-left:8px}.status{color:var(--a);font-size:20px;font-weight:700}.note{color:var(--m);font-size:13px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style><main><div class="top"><span class="eyebrow">DESK CONSTELLATION / QUIET INTERFACE</span></div><h1>摄像头识别桌面动作</h1><p class="lead">挥手和移动物品会让桌面星点发生变化</p><section class="layout"><div class="card sky"><i class="star"></i><i class="star s2"></i><i class="star s3"></i><h2 id="state">星图等待形成</h2></div><div class="card control"><video id="cam" class="preview" autoplay muted playsinline></video><div><button id="go" class="btn">开启摄像头</button></div><div id="msg" class="status">准备观察桌面</div><p class="note">画面仅用于本地交互，不依赖窗外或移动设备。</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const stars=document.querySelectorAll(".star"),v=cam;let running=false;function show(xp,yp,active){state.textContent=active?"识别到手部 星点正在跟随":"未识别到手部";stars.forEach((s,i)=>{const dx=(xp-.5)*180*(i+1)/3,dy=(yp-.5)*120*(i+1)/3;s.style.transform=`translate(${dx}px,${dy}px)`;s.style.opacity=active?"1":".45"})}const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});hands.onResults(r=>{if(!r.multiHandLandmarks?.length){show(.5,.5,false);return}const p=r.multiHandLandmarks[0][0];show(1-p.x,p.y,true)});go.onclick=async()=>{try{await navigator.mediaDevices.getUserMedia({video:true});const camera=new Camera(v,{onFrame:async()=>{await hands.send({image:v})},width:640,height:480});camera.start();msg.textContent="摄像头连接成功 正在识别手部动作"}catch(e){msg.textContent="摄像头连接失败 请检查权限"}};</script></html>
